<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Training HQ</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light dark;--radius:10px}
.blake{--bg:#C6E8BF;--panel:#E7F6E0;--panel2:#D8EFCF;--text:#0F2114;--dim:#38583F;--faint:#5F8468;--line:#A2CFA0;--line2:#BCDFB6;--accent:#F76707;--accent2:#E8590C;--accent-w:#FFDFC2;--ok:#188A4C;--ok-w:#C9EDD6;--warn:#8A5A00;--warn-w:#F7ECC9;--info:#1A5C86;--info-w:#D8EAF5;--neu:#4E7458;--neu-w:#CFE8CB;--on-accent:#fff}
.lyndsay{--bg:#F3D3E0;--panel:#FBECF2;--panel2:#F6DCE7;--text:#231018;--dim:#61404D;--faint:#8A6273;--line:#E0B7C7;--line2:#EBCBD8;--accent:#C2255C;--accent2:#9E1C4B;--accent-w:#F8D0DF;--ok:#1F7A46;--ok-w:#D6EDE1;--warn:#8A5A00;--warn-w:#F5EACB;--info:#1A5C86;--info-w:#D8EAF5;--neu:#6B5560;--neu-w:#EEDAE2;--on-accent:#fff}
@media (prefers-color-scheme:dark){
.blake{--bg:#0C1A10;--panel:#132619;--panel2:#193121;--text:#E7F5E9;--dim:#9FC2A8;--faint:#749480;--line:#28472F;--line2:#1F3A26;--accent:#FF922B;--accent2:#FFB566;--accent-w:#3F2A10;--ok:#5FD69A;--ok-w:#12351F;--warn:#E8B75C;--warn-w:#33260D;--info:#7FC2ED;--info-w:#0F2A3B;--neu:#9FC2A8;--neu-w:#1E3625;--on-accent:#0C1A10}
.lyndsay{--bg:#170D14;--panel:#22141C;--panel2:#2B1A24;--text:#F5E9EE;--dim:#C4A2B0;--faint:#96707E;--line:#3A2430;--line2:#2F1D28;--accent:#F06595;--accent2:#F58FB2;--accent-w:#43172B;--ok:#5FD69A;--ok-w:#12301F;--warn:#E8B75C;--warn-w:#33260D;--info:#7FC2ED;--info-w:#12283A;--neu:#C4A2B0;--neu-w:#2E1C26;--on-accent:#26101B}}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;background:#14181c}
.num,td,.rx,.tval{font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:20;background:#14181c;border-bottom:1px solid #2a3036;padding:8px 14px;display:flex;align-items:center;gap:12px}
.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8b95a0;font-weight:700}
.tabs{margin-left:auto;display:flex;gap:6px}
.tab{appearance:none;border:1px solid #3a424a;background:#1c2228;color:#9aa5b0;font:inherit;font-size:12.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:#e8ebee;border-color:#e8ebee;color:#14181c}
.pane{display:none;background:var(--bg);color:var(--text);min-height:100vh}
.pane.active{display:block}
main{max-width:780px;margin:0 auto;padding:18px 14px 64px}
h1{font-size:clamp(26px,7vw,36px);margin:0 0 10px;letter-spacing:-.02em}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:2px 0 6px}
h1 .sub{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:6px;background:var(--panel2);color:var(--dim);border:1px solid var(--line2)}
.chip.hot{background:var(--accent-w);color:var(--accent2);border-color:var(--accent)}
.banner{border:1px solid var(--accent);border-left-width:3px;background:var(--panel);border-radius:8px;padding:10px 13px;font-size:13.5px;color:var(--dim);margin-bottom:14px}
section{margin-top:28px}
.shead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.shead h2{font-size:13px;letter-spacing:.13em;text-transform:uppercase;margin:0}
.shead .hint{margin-left:auto;font-size:11.5px;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card.done{border-left:3px solid var(--ok)}
.card.todo{border-left:3px solid var(--line)}
.chead{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.chead h3{font-size:13.5px;margin:0;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.snum{color:var(--accent);font-weight:800;font-size:14px;font-family:ui-monospace,Consolas,monospace;margin-right:7px}
.asof{font-size:11px;color:var(--faint);margin:-6px 0 12px}
.pdates{margin-left:auto;font-size:11px;color:var(--faint);font-weight:400}
.badge{margin-left:auto;flex-shrink:0;font-size:10.5px;font-weight:750;letter-spacing:.1em;padding:3px 8px;border-radius:5px}
.b-ok{background:var(--ok-w);color:var(--ok)}.b-wait{background:var(--neu-w);color:var(--neu)}
.quip{margin-left:auto;font-size:11px;font-weight:650;color:var(--dim);white-space:nowrap}
.chead .quip+.badge{margin-left:8px}
.rows{padding:4px 13px 8px}
.row{display:grid;grid-template-columns:1fr auto;gap:1px 12px;padding:8px 0;border-bottom:1px dashed var(--line2)}
.row:last-child{border-bottom:0}
.row.drv{background:var(--accent-w);margin:0 -13px;padding-left:13px;padding-right:13px;border-radius:6px;border-bottom-color:transparent}
.row.drv .nm{font-weight:700}
.nm{font-size:14px}
.rule{display:block;font-size:11px;color:var(--faint)}
.rx{grid-column:1;font-size:12.5px;color:var(--dim)}
.logged{grid-column:1;font-size:12.5px;color:var(--dim)}
.lbl{display:inline-block;min-width:48px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pill{grid-column:2;grid-row:1/4;align-self:center;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.p-up{background:var(--ok-w);color:var(--ok)}.p-hold{background:var(--neu-w);color:var(--neu)}
.p-warn{background:var(--warn-w);color:var(--warn)}.p-sub{background:var(--info-w);color:var(--info)}
.p-none{color:var(--faint);border:1px dashed var(--line)}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
thead th{background:var(--panel2);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.cur{color:var(--accent)}
tbody th{text-align:left;padding:10px;font-weight:650;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--panel);position:sticky;left:0}
tbody td{padding:10px;border-bottom:1px solid var(--line2);color:var(--dim);white-space:nowrap}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
td.cur{color:var(--text);font-weight:650;background:var(--accent-w)}
td .sub{display:block;font-size:11px;color:var(--dim);font-weight:400}
td.e1{font-weight:700;color:var(--text);background:var(--panel2)}
.tgroup{margin-bottom:12px}
.tgroup h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.tile.empty{border-style:dashed;background:transparent}
.tlabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.tval{font-size:23px;font-weight:700;line-height:1.2}
.tile.empty .tval{color:var(--faint);font-weight:400}
.tunit{font-size:12px;font-weight:600;color:var(--dim)}
.tsub{font-size:11px;color:var(--faint)}
ul.flags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.flags li{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--dim)}
ol.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ol.hist li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.hlabel{font-size:12px;font-weight:750;color:var(--accent)}
.htext{margin:5px 0 0;font-size:13px;color:var(--dim)}
details.period{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;padding:0 13px}
details.period summary{cursor:pointer;padding:11px 0;font-weight:700;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px}
details.period summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.period[open] summary::before{transform:rotate(90deg)}
details.period .pbody{padding:2px 0 12px}
details.period .pnote{font-size:12px;color:var(--faint);margin-top:8px}
dl.legend{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px}
dl.legend dt{font-weight:700;white-space:nowrap}
dl.legend dd{margin:0;color:var(--dim)}
footer{max-width:780px;margin:0 auto;padding:0 14px 40px;font-size:11px;color:#6b7580;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
